<!DOCTYPE html>
<html>
<head>
    <title>My Shop</title>
</head>
<body>

<h1>My Shop Products</h1>

<a href="/cart">🛒 Go to Cart</a>

{% for product in products %}

<div style="border:1px solid black;padding:10px;margin:10px;">

<h3>{{ product.name }}</h3>

<p>₹{{ product.price }}</p>

<a href="/add/{{ product.id }}">
<button>Add to Cart</button>
</a>

</div>

{% endfor %}

</body>
</html>
